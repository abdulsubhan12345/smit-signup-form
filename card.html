<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    body {
        background-color: aliceblue;
    }
    #log-btn{
        width: 20vh;    
         margin-left: 110px;
         border-radius: 15px;
          height: 6vh;
         border-color: white ;
         background-color: rgba(254, 122, 73, 0.813);
          border: 2px solid gray;
          color: white;
          font-family: Georgia, 'Times New Roman', Times, serif;
        }
    
    #card {
        background-color: rgb(184, 145, 222);
        border-radius: 5px;
          display: flex;
          flex-direction: column;
          gap: 15px;
           color: white;
        background-color:rgb(253, 85, 20);
        
         border-radius: 10px;
          text-align: center;
          padding-top: 90px;
           width: 60vh;
          }

    .container {
        display: flex;
        justify-content: center;
           
        width: 100%;
        padding-top: 60px;
        
    }

    .signup {
        background-color:white;
        display: inline-block;
        border-radius: 5px;
          height: 60vh;
          border: 2px solid white;  
           border-radius: 10px;
            width: 60vh;
            text-align: center;
            font-size: 20px;
            font-family: Arial, Helvetica, sans-serif;
             
        }

    .icon {
        display: flex;
        justify-content: center;
        gap: 30px;
        padding-top: 10px;
    }
     .inputs{
        display: flex;
        gap: 8px;
        flex-direction: column;
        width: 55vh;
        padding-left: 13px;
        padding-top: 20px;
     }
     .terms{
        text-align: left;
        font-size: small;
     }
     /* #hr{
        width: 50%;
        height: 0px;
     } */
     .her{
        display: flex;
        height: 0px;
        width: 80;
     }

     span{
        font-size: small;
     }
     input{
      padding: 4px;
      border: none;
       box-shadow: 1px 4px 10px gray;
    }
     #Ri-btn{
        width: 100%;
        height: 35px;
        padding: 5px;
        background-color:#FF5F1F;
     }
     hr{
        width: 80%;
        text-align: center;
        margin-left: 30px;
     }
</style>

<body>
    <div class="container">
        <div id="card">
             <li><i class="fa-solid fa-right-from-bracket"></i></li>
            <h1>Welcome back!</h1>
            <p>To keep connected with us please login<br> with your personal info</p>
            <button  id="log-btn">
                <i class="fa-solid fa-arrow-left"></i>Login</button>
        </div>
        <div class="signup">
            <h2>Signup</h2>
            <div class="icon">
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-github"></i>
                <i class="fa-brands fa-linkedin-in"></i>
            </div>
            <br>
            <hr>
            <div class="inputs">
                <input type="text" placeholder="Name">
                <input type="text" placeholder="Email">
                <input type="password" placeholder="Password">
                <div class="terms">
                    <input type="checkbox" name="accept terms" id="">
                    <label for="accept terms">accept terms</label>
                </div>
                <button id="Ri-btn">Register</button>
            </div>
        </div>
    </div>
</body>

</html>
